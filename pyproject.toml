[project]
name = "clam"
version = "1.0.0"
description = "CLAM: Causal Spatial Disaggregation to Infer Local Effects From Coarse Data"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nbconvert>=7.16",
]

[tool.uv]
package = false
